# 生产环境 nginx 参考配置：前端静态文件 + 三个后端服务反代。
#
# 为什么必须有 proxy_set_header X-API-Key：
#   三个服务开启鉴权后（.env 里配了 API_KEY），所有请求都要带 X-API-Key。
#   浏览器自己发的请求 —— <img src="/bulk-api/images/preview?...">、<a download>、
#   shopContext.js 里的裸 fetch('/shops') —— 都带不了自定义头，只能由 nginx 在
#   服务端补。少了这几行，商品缩略图会 401（接口调用走 axios，同样依赖这里补头）。
#   开发环境由 vite 代理补头（frontend/vite.config.js），生产就是本文件。
#
# 使用方式：
#   1) 把下面三处 <API_KEY> 换成 .env 里 API_KEY 的值（同一个值）。
#      本文件含密钥，建议 chmod 600 且不要提交到仓库。
#   2) root 指向前端构建产物：cd frontend && npm run build  →  frontend/dist
#   3) nginx -t && nginx -s reload
#   已有 nginx 配置的话，只把下面三个 location 块（含 proxy_set_header）合并过去即可。
#
# 注意：后端服务保持只监听 127.0.0.1（代码默认值）。nginx 与它们同机，走回环就行；
#      为了 nginx 把它们改成 0.0.0.0，等于把接口重新暴露给局域网。

server {
    listen       80;
    server_name  _;                      # ← 换成实际域名

    # Excel 导入、图片上传（base64 会再膨胀约 4/3）都走这些接口；nginx 默认 1m 会直接 413
    client_max_body_size 50m;

    root  /path/to/PythonProject/frontend/dist;
    index index.html;

    # ---------- 前端静态文件 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 微信小店服务 :8000 ----------
    location /api/ {
        # 末尾的 "/" = 去掉 /api 前缀，与 vite 的 rewrite: path.replace(/^\/api/, '') 对齐
        proxy_pass          http://127.0.0.1:8000/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-API-Key         <API_KEY>;   # ← 鉴权头，必须有
        # 微信商品列表很慢（每个商品带全部图片/SKU，20 条约 28 秒），别用默认 60s
        proxy_read_timeout  300s;
    }

    # ---------- 小红书服务 :8010 ----------
    location /xhs-api/ {
        proxy_pass          http://127.0.0.1:8010/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-API-Key         <API_KEY>;   # ← 鉴权头，必须有
        proxy_read_timeout  300s;
    }

    # ---------- 批量发布中台 :8020 ----------
    location /bulk-api/ {
        proxy_pass          http://127.0.0.1:8020/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-API-Key         <API_KEY>;   # ← 鉴权头，必须有
        # 导入货盘表 / 扫描图片 / 类目校验都比较慢
        proxy_read_timeout  600s;
        # 导出 Excel 是流式下载，关掉缓冲让它直接落盘
        proxy_buffering     off;
    }
}
